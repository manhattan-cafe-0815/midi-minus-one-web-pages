<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>マイナスワン MIDIプレイヤー</title>
  <script type="module" crossorigin src="./assets/main-Zcqw2vBq.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/spessasynth_processor.min-CDgYhvzD.js">
  <link rel="stylesheet" crossorigin href="./assets/main-CFEo2er-.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>マイナスワン MIDIプレイヤー</h1>
    </header>

    <section class="card" aria-labelledby="h-sound">
      <h2 id="h-sound">音源</h2>
      <p id="sound-status" class="status">確認中…</p>
      <div class="row">
        <label class="btn" for="sf-file">音源（.sf2）を選ぶ</label>
        <input type="file" id="sf-file" class="visually-hidden" />
        <button id="btn-sf-remove" type="button" class="btn" disabled>保存した音源を消す</button>
      </div>
    </section>

    <section class="card" aria-labelledby="h-song">
      <h2 id="h-song">曲</h2>
      <p id="song-status" class="status">MIDI ファイルを選んでください。</p>
      <div class="row">
        <label class="btn" for="midi-file">MIDI を開く</label>
        <input type="file" id="midi-file" class="visually-hidden" accept=".mid,.midi" />
      </div>
    </section>

    <section class="card" aria-labelledby="h-play">
      <h2 id="h-play">再生</h2>
      <div class="row transport">
        <button id="btn-play" type="button" class="btn primary" disabled>▶ 再生</button>
        <button id="btn-stop" type="button" class="btn" disabled>■ 停止</button>
      </div>
      <div class="seek">
        <input type="range" id="seek" min="0" max="1000" step="1" value="0" disabled aria-label="再生位置" />
        <div class="time"><span id="time-now">0:00</span><span id="time-total">0:00</span></div>
      </div>
    </section>

    <section class="card" aria-labelledby="h-parts">
      <h2 id="h-parts">パート</h2>
      <div id="groups" class="groups"></div>
      <div class="row">
        <button id="btn-all" type="button" class="btn" disabled>全チャンネル</button>
        <button id="btn-unsolo" type="button" class="btn" hidden>ソロ解除</button>
      </div>
    </section>

    <section class="card" aria-labelledby="h-speed">
      <h2 id="h-speed">速度</h2>
      <div class="row speed">
        <input type="range" id="speed" min="-34" max="34" step="1" value="0" aria-label="速度" />
        <output id="speed-label" for="speed">×100%</output>
        <button id="btn-speed-reset" type="button" class="btn">等倍</button>
      </div>
      <p id="bpm" class="status bpm">BPM: —</p>
    </section>

    <section class="card" aria-labelledby="h-channels">
      <h2 id="h-channels">チャンネル</h2>
      <div id="channels" class="channels"><p class="status">曲を開くと、チャンネルの一覧が出ます。</p></div>
    </section>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <details class="diag">
      <summary>診断</summary>
      <pre id="diag"></pre>
    </details>
  </main>
</body>
</html>
